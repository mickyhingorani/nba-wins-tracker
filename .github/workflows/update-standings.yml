name: Update NBA standings

on:
  schedule:
    # Backup only. The daily update is started by cron-job.org at 4:40am Eastern.
    # 10:37 UTC = 6:37am EDT (5:37am EST in winter). GitHub's scheduler can run late or skip.
    - cron: "37 10 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch standings
        run: python3 fetch_standings.py

      - name: Commit if changed
        run: |
          git config user.name "standings-bot"
          git config user.email "standings-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update standings $(date -u +%Y-%m-%d)"
            # GitHub occasionally returns a transient 5xx on push; retry before giving up.
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                exit 0
              fi
              echo "Push failed (attempt $i of 3), retrying..."
              sleep $((i * 10))
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi
