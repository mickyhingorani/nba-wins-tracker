name: Update NBA standings

on:
  schedule:
    # 12:20 UTC = 8:20am Eastern in daylight time, 7:20am in standard time.
    # GitHub sometimes runs scheduled jobs a bit late; that's fine here.
    - cron: "20 12 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch standings
        run: python3 fetch_standings.py

      - name: Commit if changed
        run: |
          git config user.name "standings-bot"
          git config user.email "standings-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update standings $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
