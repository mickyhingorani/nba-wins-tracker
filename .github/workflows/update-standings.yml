name: Update NBA standings

on:
  schedule:
    # Times are UTC. Odd minutes dodge GitHub's busy top-of-hour queue.
    # Main run: 4:37am Eastern (3:37am after clocks fall back), after
    # West Coast games and overtimes are final.
    - cron: "37 8 * * *"
    # Safety run: 6:43am Eastern (5:43am in winter), in case the first
    # run was delayed or a late game wasn't final yet.
    - cron: "43 10 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch standings
        run: python3 fetch_standings.py

      - name: Commit if changed
        run: |
          git config user.name "standings-bot"
          git config user.email "standings-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update standings $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
