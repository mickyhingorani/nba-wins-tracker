name: Update NBA standings

on:
  schedule:
    # GitHub's scheduler is best effort: runs can be late or skipped. So try every hour
    # through the morning. Extra runs are harmless; nothing is committed unless data changed.
    # Times are UTC: 7:37-15:37 UTC = 3:37-11:37am EDT (2:37-10:37am EST in winter).
    - cron: "37 7-15 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch standings
        run: python3 fetch_standings.py

      - name: Commit if changed
        run: |
          git config user.name "standings-bot"
          git config user.email "standings-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update standings $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
