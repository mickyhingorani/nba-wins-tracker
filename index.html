<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Wins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #06051A;
    --indigo: #15125A;
    --panel-top: #2A2C86;
    --panel-bot: #10114A;
    --edge: #3D3FA8;
    --text: #FFFFFF;
    --dim: #A7A9DD;
    --gold-hi: #FFF1B8;
    --gold: #F2C14E;
    --gold-lo: #8A5A12;
    --Pablo: #FF4F5E;
    --Pete: #FF9F2E;
    --Micky: #43D2FF;
    --Ryall: #63E38E;
    --Unpicked: #A7A9DD;
    --gold-face: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 45%, #C98F22 55%, var(--gold-hi) 100%);
    --gloss: linear-gradient(180deg, var(--panel-top) 0%, #1C1D66 48%, var(--panel-bot) 52%, #0B0C38 100%);
    --face: "Saira", "Arial", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    font: 500 15px/1.4 var(--face);
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(120, 110, 255, 0.35), transparent 60%),
      linear-gradient(180deg, var(--indigo) 0%, var(--night) 600px);
    background-color: var(--night);
    min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 26px 16px 48px; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* 3D extruded gold title */
  h1 {
    margin: 0; text-align: center;
    font: italic 900 50px/1 var(--face); font-stretch: 125%;
    color: var(--gold);
  }
  h1 span {
    display: inline-block;
    background: var(--gold-face); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(1px 1px 0 var(--gold-lo)) drop-shadow(1px 1px 0 #6B420A) drop-shadow(1px 1px 0 #6B420A)
            drop-shadow(1px 1px 0 #4A2C05) drop-shadow(1px 1px 0 #3A2204) drop-shadow(2px 4px 8px rgba(0, 0, 0, 0.85));
  }
  .sub {
    margin: 12px auto 0; width: max-content; max-width: 100%;
    padding: 4px 16px; border: 1px solid var(--gold); border-radius: 3px;
    background: var(--gloss); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    font: italic 700 14px var(--face); font-stretch: 112%;
  }
  .updated { text-align: center; color: var(--dim); font-size: 13px; margin-top: 6px; }

  .panel {
    background: var(--gloss);
    border: 2px solid var(--gold);
    border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -1px 0 rgba(0,0,0,0.5), 0 6px 18px rgba(0,0,0,0.6);
  }
  h2 {
    margin: 32px 0 12px; font: italic 800 22px/1 var(--face); font-stretch: 118%;
    color: var(--gold); text-shadow: 1px 1px 0 var(--gold-lo), 2px 2px 0 #4A2C05;
  }
  h2 small { font: italic 500 14px var(--face); font-stretch: 100%; color: var(--dim); text-shadow: none; margin-left: 8px; }

  /* Race */
  .race { margin-top: 22px; padding: 12px 8px 6px; background: linear-gradient(180deg, #0F1050, #07072A); }
  .race svg { display: block; width: 100%; height: auto; overflow: visible; }
  .race .grid { stroke: var(--edge); stroke-width: 1; opacity: 0.5; }
  .race .tick { fill: var(--dim); font: italic 600 11px var(--face); }
  .race .path { fill: none; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  .race .end { font: italic 900 27px var(--face); font-stretch: 110%; }
  .race .end-name { font: italic 700 12px var(--face); }
  .race .wipe { clip-path: inset(0 100% 0 0); animation: wipe 1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) { .race .wipe { animation: none; clip-path: none; } }

  /* Standings */
  .plates { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .plate { display: grid; grid-template-columns: 50px 1fr 76px; overflow: hidden; }
  .plate .rank {
    display: grid; place-items: center; font: italic 900 26px var(--face); color: #0A0A2A;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -2px 0 rgba(0,0,0,0.25);
  }
  .plate .name { padding: 8px 12px; font: italic 800 22px/1.1 var(--face); font-stretch: 115%; }
  .plate .name small { display: block; font: italic 500 12px var(--face); color: var(--dim); font-stretch: 100%; }
  .plate .wins {
    display: grid; place-items: center; background: #05051C; border-left: 2px solid var(--gold);
    font: italic 900 36px var(--face); color: var(--gold);
    text-shadow: 0 0 10px rgba(242, 193, 78, 0.45);
  }

  /* Last night */
  .haul { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .haul div { padding: 7px 8px 8px; text-align: center; border-color: currentColor; }
  .haul .who { display: block; font: italic 700 13px var(--face); color: var(--text); }
  .haul b { display: block; font: italic 900 30px/1.05 var(--face); }
  .haul .rec { font: italic 500 12px var(--face); color: var(--dim); }

  .bugs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bug { overflow: hidden; border-width: 1px; }
  .bug .side { display: grid; grid-template-columns: 7px 1fr 46px; align-items: stretch; }
  .bug .side + .side { border-top: 1px solid var(--edge); }
  .bug .abbr { padding: 5px 8px; font: italic 800 17px/1.1 var(--face); font-stretch: 115%; }
  .bug .abbr small { display: block; font: italic 600 11px var(--face); font-stretch: 100%; }
  .bug .pts { display: grid; place-items: center; background: #05051C; font: italic 900 20px var(--face); color: var(--gold); }
  .bug .lost .abbr span, .bug .lost .pts { color: var(--dim); opacity: 0.65; }

  /* Rosters */
  .rosters details + details { border-top: 1px solid var(--edge); }
  .rosters summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; padding: 10px 14px; font: italic 800 20px var(--face); font-stretch: 115%; }
  .rosters summary::-webkit-details-marker { display: none; }
  .roster { list-style: none; margin: 0; padding: 0 14px 10px; }
  .roster li { display: flex; justify-content: space-between; padding: 3px 0; }
  .roster .wl { font: italic 800 15px var(--face); color: var(--gold); }

  @media (max-width: 380px) {
    .haul { grid-template-columns: repeat(2, 1fr); }
    .bugs { grid-template-columns: 1fr; }
    h1 { font-size: 42px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>NBA WINS</span></h1>
    <div class="sub" id="season"></div>
    <div class="updated" id="updated"></div>
  </header>
  <section class="panel race" id="race" aria-label="Cumulative wins by player"></section>
  <h2>Standings</h2>
  <ol class="plates" id="standings"></ol>
  <section id="last-night"></section>
  <h2>Teams</h2>
  <section class="panel rosters" id="rosters"></section>
</main>
<script>
const PLAYERS = ['Pablo', 'Pete', 'Micky', 'Ryall'];
const color = n => `var(--${PLAYERS.includes(n) ? n : 'Unpicked'})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
const get = p => fetch(`data/${p}?${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null);
function chip(t) {
  const hex = (t.color || '#888888').replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 40 ? (t.alt || '#888') : t.color;
}

Promise.all([get('standings.json'), get('history.json'), get('last_night.json')]).then(([st, hist, night]) => {
  if (!st) { document.getElementById('updated').textContent = 'No standings yet.'; return; }
  document.getElementById('season').textContent = st.season + ' regular season';
  document.getElementById('updated').textContent =
    'Updated ' + new Date(st.updated).toLocaleString(undefined, {weekday: 'short', hour: 'numeric', minute: '2-digit'});
  race(hist); standings(st); lastNight(night); rosters(st);
});

function race(hist) {
  const el = document.getElementById('race');
  const days = hist ? Object.keys(hist.days) : [];
  if (days.length < 2) { el.innerHTML = '<p>The race appears after a couple of game days.</p>'; return; }
  const series = PLAYERS.map(name => { let t = 0; return {name, pts: [0, ...days.map(d => (t += hist.days[d][name] || 0))]}; });
  const n = days.length, max = Math.max(...series.map(s => s.pts[n]));
  const step = max > 60 ? 20 : max > 25 ? 10 : 5, top = Math.ceil((max + 1) / step) * step;
  const W = 360, H = 220, L = 22, R = 80, T = 8, B = 22;
  const x = i => L + (i / n) * (W - L - R), y = v => T + (1 - v / top) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series.map(s => `${s.name} ${s.pts[n]} wins`).join(', ')}">`;
  for (let v = 0; v <= top; v += step)
    svg += `<line class="grid" x1="${L}" x2="${W - R + 6}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  svg += `<text class="tick" x="${x(0)}" y="${H - 3}">${fmtDay(days[0])}</text><text class="tick" x="${x(n)}" y="${H - 3}" text-anchor="end">${fmtDay(days[n - 1])}</text><g class="wipe">`;
  const order = [...series].sort((a, b) => a.pts[n] - b.pts[n]);
  for (const s of order) {
    const d = s.pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    svg += `<path class="path" d="${d}" stroke="${color(s.name)}" style="filter:drop-shadow(0 0 4px ${color(s.name)})"/>`;
  }
  svg += '</g>';
  const labels = order.map(s => ({s, y: y(s.pts[n])})).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 26);
  const over = labels[labels.length - 1].y - (H - B); if (over > 0) labels.forEach(l => l.y -= over);
  for (const {s, y: ly} of labels)
    svg += `<text x="${x(n) + 10}" y="${ly + 9}" fill="${color(s.name)}"><tspan class="end">${s.pts[n]}</tspan><tspan class="end-name" dx="4">${esc(s.name)}</tspan></text>`;
  el.innerHTML = svg + '</svg>';
}

function standings(st) {
  const lead = st.players[0];
  document.getElementById('standings').innerHTML = st.players.map((p, i) => {
    const gb = ((lead.wins - p.wins) + (p.losses - lead.losses)) / 2;
    return `<li class="plate panel">
      <span class="rank" style="background:${color(p.name)}">${i + 1}</span>
      <span class="name">${esc(p.name)}<small>${p.wins}–${p.losses}, ${i === 0 ? 'leading' : gb ? gb + ' back' : 'tied'}</small></span>
      <span class="wins">${p.wins}</span></li>`;
  }).join('');
}

function lastNight(night) {
  const el = document.getElementById('last-night');
  if (!night) return;
  const day = new Date(night.date + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'long', month: 'short', day: 'numeric'});
  const haul = PLAYERS.map(n => ({n, ...night.haul[n]})).sort((a, b) => b.wins - a.wins || a.losses - b.losses)
    .map(h => `<div class="panel" style="color:${color(h.n)}"><span class="who">${esc(h.n)}</span><b>+${h.wins}</b><span class="rec">${h.wins + h.losses ? `${h.wins}–${h.losses}` : 'Off night'}</span></div>`).join('');
  const side = (t, f) => `<div class="side ${f && !t.winner ? 'lost' : ''}">
      <span style="background:${chip(t)}"></span>
      <span class="abbr"><span>${esc(t.abbr)}</span><small style="color:${color(t.owner)}">${esc(t.owner === 'Unpicked' ? 'No one' : t.owner)}</small></span>
      <span class="pts">${t.score ?? ''}</span></div>`;
  el.innerHTML = `<h2>Last night<small>${esc(day)}</small></h2>` +
    (night.games.length ? `<div class="haul">${haul}</div><div class="bugs">${night.games.map(g => `<div class="bug panel">${side(g.away, g.final)}${side(g.home, g.final)}</div>`).join('')}</div>` : '<p>No games were played.</p>');
}

function rosters(st) {
  const group = (name, g, label) => `<details><summary><span style="color:${color(name)}">${esc(label)}</span><span>${g.wins}–${g.losses}</span></summary>
    <ul class="roster">${g.teams.map(t => `<li><span>${esc(t.name)}</span><span class="wl">${t.wins}–${t.losses}</span></li>`).join('')}</ul></details>`;
  document.getElementById('rosters').innerHTML =
    st.players.map(p => group(p.name, p, p.name)).join('') + group('Unpicked', st.unpicked, 'Nobody');
}
</script>
</body>
</html>
