<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Wins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --royal: #12308F;
    --deep: #071447;
    --plate: #0B1D66;
    --rule: #2A4AB8;
    --text: #FFFFFF;
    --dim: #A9B6E0;
    --red: #E3242B;
    --gold: #F2C230;
    --Pablo: #FF4D4D;
    --Pete: #FFC93C;
    --Micky: #4FD3FF;
    --Ryall: #5EE38B;
    --Unpicked: #A9B6E0;
    --chrome: linear-gradient(180deg, #FFFFFF 0%, #DCE3F2 38%, #7E8BAA 52%, #C9D2E6 64%, #FFFFFF 100%);
    --face: "Archivo", "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    font: 500 15px/1.4 var(--face);
    background: linear-gradient(180deg, var(--royal) 0%, var(--deep) 520px, var(--deep) 100%);
    min-height: 100vh;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
  }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 48px; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .chrome {
    background: var(--chrome);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #030A2A);
  }
  h1 { margin: 0; font: italic 900 46px/0.95 var(--face); font-stretch: 125%; letter-spacing: -0.01em; }
  .stripes { margin: 10px 0 6px; display: grid; gap: 3px; }
  .stripes i { display: block; height: 4px; }
  .stripes i:nth-child(1) { background: var(--red); }
  .stripes i:nth-child(2) { background: var(--text); width: 82%; }
  .stripes i:nth-child(3) { background: var(--gold); width: 64%; }
  .meta { display: flex; justify-content: space-between; color: var(--dim); font: italic 600 13px var(--face); }
  .meta b { color: var(--text); font-stretch: 125%; }

  h2 { margin: 34px 0 12px; font: italic 900 22px/1 var(--face); font-stretch: 125%; }
  h2 small { font: italic 500 14px var(--face); font-stretch: 100%; color: var(--dim); margin-left: 8px; -webkit-text-fill-color: var(--dim); }

  /* Race */
  .race { margin-top: 18px; border: 2px solid var(--rule); background: rgba(3, 10, 42, 0.55); padding: 10px 6px 4px; }
  .race svg { display: block; width: 100%; height: auto; overflow: visible; }
  .race .grid { stroke: var(--rule); stroke-width: 1; opacity: 0.6; }
  .race .tick { fill: var(--dim); font: italic 600 11px var(--face); }
  .race .path { fill: none; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  .race .end { font: italic 900 26px var(--face); font-stretch: 112%; }
  .race .end-name { font: italic 700 12px var(--face); }
  .race .wipe { clip-path: inset(0 100% 0 0); animation: wipe 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) { .race .wipe { animation: none; clip-path: none; } }

  /* Lower-third plates */
  .plates { list-style: none; margin: 0; padding: 0 12px 0 8px; display: grid; gap: 8px; }
  .plate { display: grid; grid-template-columns: 44px 1fr 72px; transform: skewX(-12deg); box-shadow: 3px 3px 0 #030A2A; }
  .plate > * { transform: skewX(12deg); display: flex; align-items: center; }
  .plate .rank { justify-content: center; font: italic 900 24px var(--face); color: var(--deep); }
  .plate .name { background: var(--plate); padding: 8px 12px; font: italic 900 22px/1.1 var(--face); font-stretch: 118%; flex-direction: column; align-items: flex-start; }
  .plate .name small { font: italic 600 12px var(--face); color: var(--dim); font-stretch: 100%; }
  .plate .wins { background: var(--chrome); justify-content: center; font: italic 900 34px var(--face); color: var(--deep); }
  .plate .rank, .plate .name, .plate .wins { transform: none; }
  .plate { overflow: hidden; }

  /* Last night */
  .haul { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; padding: 0 10px 0 6px; }
  .haul div { transform: skewX(-12deg); background: var(--plate); border-top: 4px solid currentColor; padding: 6px 8px 8px; box-shadow: 3px 3px 0 #030A2A; }
  .haul div > * { display: block; transform: skewX(12deg); }
  .haul .who { font: italic 800 13px var(--face); color: var(--text); }
  .haul b { font: italic 900 30px/1.05 var(--face); }
  .haul .rec { font: italic 500 12px var(--face); color: var(--dim); }

  .bugs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bug { background: var(--plate); box-shadow: 3px 3px 0 #030A2A; }
  .bug .side { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; column-gap: 8px; padding: 5px 10px 5px 0; }
  .bug .side + .side { border-top: 1px solid var(--rule); }
  .bug .chip { align-self: stretch; }
  .bug .abbr { font: italic 900 18px var(--face); font-stretch: 115%; }
  .bug .abbr small { display: block; font: italic 600 11px var(--face); font-stretch: 100%; }
  .bug .pts { font: italic 900 22px var(--face); }
  .bug .lost .abbr span, .bug .lost .pts { color: var(--dim); opacity: 0.7; }

  /* Rosters */
  details { border-bottom: 1px solid var(--rule); }
  summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; padding: 10px 0; font: italic 900 20px var(--face); font-stretch: 118%; }
  summary::-webkit-details-marker { display: none; }
  .roster { list-style: none; margin: 0 0 10px; padding: 0; }
  .roster li { display: flex; justify-content: space-between; padding: 3px 0; font: 500 15px var(--face); }
  .roster .wl { font: italic 800 15px var(--face); }

  @media (max-width: 380px) {
    .haul { grid-template-columns: repeat(2, 1fr); }
    .bugs { grid-template-columns: 1fr; }
    h1 { font-size: 40px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="chrome">NBA WINS</h1>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="meta"><b id="season"></b><span id="updated"></span></div>
  </header>
  <section class="race" id="race" aria-label="Cumulative wins by player"></section>
  <h2 class="chrome">Standings</h2>
  <ol class="plates" id="standings"></ol>
  <section id="last-night"></section>
  <section id="rosters"></section>
</main>
<script>
const PLAYERS = ['Pablo', 'Pete', 'Micky', 'Ryall'];
const color = n => `var(--${PLAYERS.includes(n) ? n : 'Unpicked'})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
const get = p => fetch(`data/${p}?${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null);
function chip(t) {
  const hex = (t.color || '#888888').replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 40 ? (t.alt || '#888') : t.color;
}

Promise.all([get('standings.json'), get('history.json'), get('last_night.json')]).then(([st, hist, night]) => {
  if (!st) { document.getElementById('updated').textContent = 'No standings yet.'; return; }
  document.getElementById('season').textContent = st.season + ' season';
  document.getElementById('updated').textContent =
    'Updated ' + new Date(st.updated).toLocaleString(undefined, {weekday: 'short', hour: 'numeric', minute: '2-digit'});
  race(hist); standings(st); lastNight(night); rosters(st);
});

function race(hist) {
  const el = document.getElementById('race');
  const days = hist ? Object.keys(hist.days) : [];
  if (days.length < 2) { el.innerHTML = '<p>The race appears after a couple of game days.</p>'; return; }
  const series = PLAYERS.map(name => { let t = 0; return {name, pts: [0, ...days.map(d => (t += hist.days[d][name] || 0))]}; });
  const n = days.length, max = Math.max(...series.map(s => s.pts[n]));
  const step = max > 60 ? 20 : max > 25 ? 10 : 5, top = Math.ceil((max + 1) / step) * step;
  const W = 360, H = 220, L = 22, R = 80, T = 8, B = 22;
  const x = i => L + (i / n) * (W - L - R), y = v => T + (1 - v / top) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series.map(s => `${s.name} ${s.pts[n]} wins`).join(', ')}">`;
  for (let v = 0; v <= top; v += step)
    svg += `<line class="grid" x1="${L}" x2="${W - R + 6}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  svg += `<text class="tick" x="${x(0)}" y="${H - 3}">${fmtDay(days[0])}</text><text class="tick" x="${x(n)}" y="${H - 3}" text-anchor="end">${fmtDay(days[n - 1])}</text><g class="wipe">`;
  const order = [...series].sort((a, b) => a.pts[n] - b.pts[n]);
  for (const s of order) {
    const d = s.pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    svg += `<path class="path" d="${d}" stroke="${color(s.name)}" style="filter:drop-shadow(0 0 3px ${color(s.name)})"/>`;
  }
  svg += '</g>';
  const labels = order.map(s => ({s, y: y(s.pts[n])})).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 26);
  const over = labels[labels.length - 1].y - (H - B); if (over > 0) labels.forEach(l => l.y -= over);
  for (const {s, y: ly} of labels)
    svg += `<text x="${x(n) + 10}" y="${ly + 9}" fill="${color(s.name)}"><tspan class="end">${s.pts[n]}</tspan><tspan class="end-name" dx="4">${esc(s.name)}</tspan></text>`;
  el.innerHTML = svg + '</svg>';
}

function standings(st) {
  const lead = st.players[0];
  document.getElementById('standings').innerHTML = st.players.map((p, i) => {
    const gb = ((lead.wins - p.wins) + (p.losses - lead.losses)) / 2;
    return `<li class="plate">
      <span class="rank" style="background:${color(p.name)}">${i + 1}</span>
      <span class="name">${esc(p.name)}<small>${p.wins}–${p.losses}, ${i === 0 ? 'leading' : gb ? gb + ' back' : 'tied'}</small></span>
      <span class="wins">${p.wins}</span></li>`;
  }).join('');
}

function lastNight(night) {
  const el = document.getElementById('last-night');
  if (!night) return;
  const day = new Date(night.date + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'long', month: 'short', day: 'numeric'});
  const haul = PLAYERS.map(n => ({n, ...night.haul[n]})).sort((a, b) => b.wins - a.wins || a.losses - b.losses)
    .map(h => `<div style="color:${color(h.n)}"><span class="who">${esc(h.n)}</span><b>+${h.wins}</b><span class="rec">${h.wins + h.losses ? `${h.wins}–${h.losses}` : 'Off night'}</span></div>`).join('');
  const side = (t, f) => `<div class="side ${f && !t.winner ? 'lost' : ''}">
      <span class="chip" style="background:${chip(t)}"></span>
      <span class="abbr"><span>${esc(t.abbr)}</span><small style="color:${color(t.owner)}">${esc(t.owner === 'Unpicked' ? 'No one' : t.owner)}</small></span>
      <span class="pts">${t.score ?? ''}</span></div>`;
  el.innerHTML = `<h2 class="chrome">Last night<small>${esc(day)}</small></h2>` +
    (night.games.length ? `<div class="haul">${haul}</div><div class="bugs">${night.games.map(g => `<div class="bug">${side(g.away, g.final)}${side(g.home, g.final)}</div>`).join('')}</div>` : '<p>No games were played.</p>');
}

function rosters(st) {
  const group = (name, g, label) => `<details><summary><span style="color:${color(name)}">${esc(label)}</span><span>${g.wins}–${g.losses}</span></summary>
    <ul class="roster">${g.teams.map(t => `<li><span>${esc(t.name)}</span><span class="wl">${t.wins}–${t.losses}</span></li>`).join('')}</ul></details>`;
  document.getElementById('rosters').innerHTML = '<h2 class="chrome">Teams</h2>' +
    st.players.map(p => group(p.name, p, p.name)).join('') + group('Unpicked', st.unpicked, 'Nobody');
}
</script>
</body>
</html>
