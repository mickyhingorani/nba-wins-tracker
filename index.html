<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Wins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800;900&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --housing: #181512;
    --panel: #0F0D0B;
    --frame: #3B342B;
    --bulb-off: #2B2620;
    --text: #F3E9D2;
    --dim: #8C7F6A;
    --Pablo: #FF4B3A;
    --Pete: #FFB43A;
    --Micky: #F3E9D2;
    --Ryall: #5BE07C;
    --Unpicked: #8C7F6A;
    --dots: "Doto", monospace;
    --fine: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    font: 500 15px/1.4 var(--fine);
    background:
      radial-gradient(circle at 1.5px 1.5px, var(--bulb-off) 1.2px, transparent 1.6px) 0 0 / 9px 9px,
      var(--housing);
  }
  main { max-width: 560px; margin: 0 auto; padding: 18px 14px 48px; }
  :focus-visible { outline: 2px solid var(--Pete); outline-offset: 2px; }

  .board {
    background: var(--panel);
    border: 3px solid var(--frame);
    box-shadow: inset 0 0 0 1px #000, 0 2px 0 #000;
    padding: 14px;
    margin-top: 14px;
  }
  .glow { text-shadow: 0 0 6px currentColor, 0 0 1px currentColor; }

  header.board { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 0; }
  h1 { margin: 0; font: 900 40px/0.95 var(--dots); color: var(--Pete); letter-spacing: 0.02em; }
  h1 small { display: block; font-size: 22px; color: var(--Pablo); margin-top: 4px; }
  .updated { color: var(--dim); text-align: right; font-size: 13px; }

  h2 { margin: 0 0 10px; font: 800 20px/1 var(--dots); color: var(--Pete); }
  h2 small { font: 500 14px var(--fine); color: var(--dim); margin-left: 8px; }

  /* Race */
  .race svg { display: block; width: 100%; height: auto; overflow: visible; }
  .race .tick { fill: var(--dim); font: 500 11px var(--fine); }
  .race .rule { stroke: var(--bulb-off); stroke-width: 1; stroke-dasharray: 1 5; }
  .race .bulbs { fill: none; stroke-width: 4.6; stroke-linecap: round; stroke-dasharray: 0.01 7.2; }
  .race .end { font: 900 30px var(--dots); }
  .race .end-name { font: 800 13px var(--dots); }
  .race .light { opacity: 0; animation: light 0.9s steps(6) forwards; }
  @keyframes light { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .race .light { animation: none; opacity: 1; } }

  /* Standings */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li {
    display: grid; grid-template-columns: 1fr 86px 74px; align-items: center;
    padding: 8px 0; border-top: 1px dashed var(--frame);
  }
  .rows li:first-child { border-top: 0; }
  .rows .who { font: 900 26px/1 var(--dots); }
  .rows .num { font: 900 46px/0.9 var(--dots); text-align: right; }
  .rows .rec { text-align: right; font: 600 17px/1.1 var(--fine); color: var(--text); }
  .rows .rec span { display: block; font-size: 13px; color: var(--dim); }

  /* Last night */
  .haul { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .haul div { border: 2px solid var(--frame); padding: 6px 8px 8px; text-align: center; }
  .haul .who { font: 800 13px var(--dots); }
  .haul b { display: block; font: 900 34px/1 var(--dots); margin: 2px 0; }
  .haul .rec { color: var(--dim); font-size: 12px; }

  .linescore { display: grid; gap: 10px; }
  .game { border: 2px solid var(--frame); padding: 2px 10px; }
  .side { display: grid; grid-template-columns: 58px 1fr 64px; align-items: center; padding: 5px 0; }
  .side + .side { border-top: 1px dashed var(--frame); }
  .side .abbr { font: 900 22px var(--dots); color: var(--text); }
  .side .owner { font: 600 14px var(--fine); }
  .side .owner span { color: var(--dim); margin-left: 6px; }
  .side .pts { font: 900 30px var(--dots); text-align: right; color: var(--Pete); }
  .side.lost .abbr, .side.lost .pts { opacity: 0.35; text-shadow: none; }

  /* Rosters */
  details { border-top: 1px dashed var(--frame); }
  details:first-of-type { border-top: 0; }
  summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; padding: 10px 0; font: 900 22px var(--dots); }
  summary::-webkit-details-marker { display: none; }
  summary .rec { color: var(--text); }
  .roster { list-style: none; margin: 0 0 10px; padding: 0; }
  .roster li { display: flex; justify-content: space-between; padding: 3px 0; font: 600 17px var(--fine); }
  .roster .wl { font: 800 17px var(--dots); color: var(--Pete); }

  @media (max-width: 380px) {
    .haul { grid-template-columns: repeat(2, 1fr); }
    .rows .num { font-size: 40px; }
  }
</style>
</head>
<body>
<main>
  <header class="board">
    <h1 class="glow">NBA WINS<small id="season"></small></h1>
    <div class="updated" id="updated"></div>
  </header>
  <section class="board race" id="race" aria-label="Cumulative wins by player"></section>
  <section class="board"><h2 class="glow">Standings</h2><ol class="rows" id="standings"></ol></section>
  <section class="board" id="last-night"></section>
  <section class="board" id="rosters"></section>
</main>
<script>
const PLAYERS = ['Pablo', 'Pete', 'Micky', 'Ryall'];
const color = n => `var(--${PLAYERS.includes(n) ? n : 'Unpicked'})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
const get = p => fetch(`data/${p}?${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null);

Promise.all([get('standings.json'), get('history.json'), get('last_night.json')]).then(([st, hist, night]) => {
  if (!st) { document.getElementById('updated').textContent = 'No standings yet.'; return; }
  document.getElementById('season').textContent = st.season;
  document.getElementById('updated').textContent =
    'Updated ' + new Date(st.updated).toLocaleString(undefined, {weekday: 'short', hour: 'numeric', minute: '2-digit'});
  race(hist); standings(st); lastNight(night); rosters(st);
});

function race(hist) {
  const el = document.getElementById('race');
  const days = hist ? Object.keys(hist.days) : [];
  if (days.length < 2) { el.innerHTML = '<p>The race appears after a couple of game days.</p>'; return; }
  const series = PLAYERS.map(name => { let t = 0; return {name, pts: [0, ...days.map(d => (t += hist.days[d][name] || 0))]}; });
  const n = days.length, max = Math.max(...series.map(s => s.pts[n]));
  const step = max > 60 ? 20 : max > 25 ? 10 : 5, top = Math.ceil((max + 1) / step) * step;
  const W = 360, H = 230, L = 22, R = 84, T = 8, B = 22;
  const x = i => L + (i / n) * (W - L - R), y = v => T + (1 - v / top) * (H - T - B);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series.map(s => `${s.name} ${s.pts[n]} wins`).join(', ')}">`;
  for (let v = 0; v <= top; v += step) {
    svg += `<line class="rule" x1="${L}" x2="${W - R + 6}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  svg += `<text class="tick" x="${x(0)}" y="${H - 3}">${fmtDay(days[0])}</text><text class="tick" x="${x(n)}" y="${H - 3}" text-anchor="end">${fmtDay(days[n - 1])}</text>`;
  const order = [...series].sort((a, b) => a.pts[n] - b.pts[n]);
  order.forEach((s, k) => {
    const d = s.pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    svg += `<path class="bulbs light" d="${d}" stroke="${color(s.name)}" style="filter:drop-shadow(0 0 2.5px ${color(s.name)});animation-delay:${k * 0.12}s"/>`;
  });
  const labels = order.map(s => ({s, y: y(s.pts[n])})).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 28);
  const over = labels[labels.length - 1].y - (H - B); if (over > 0) labels.forEach(l => l.y -= over);
  for (const {s, y: ly} of labels)
    svg += `<text x="${x(n) + 10}" y="${ly + 10}" fill="${color(s.name)}" style="filter:drop-shadow(0 0 3px ${color(s.name)})"><tspan class="end">${s.pts[n]}</tspan><tspan class="end-name" dx="4">${esc(s.name)}</tspan></text>`;
  el.innerHTML = svg + '</svg>';
}

function standings(st) {
  const lead = st.players[0];
  document.getElementById('standings').innerHTML = st.players.map((p, i) => {
    const gb = ((lead.wins - p.wins) + (p.losses - lead.losses)) / 2;
    return `<li style="color:${color(p.name)}">
      <span class="who glow">${esc(p.name)}</span>
      <span class="num glow">${p.wins}</span>
      <span class="rec">${p.wins}–${p.losses}<span>${i === 0 ? 'Leading' : gb ? gb + ' back' : 'Tied'}</span></span></li>`;
  }).join('');
}

function lastNight(night) {
  const el = document.getElementById('last-night');
  if (!night) { el.remove(); return; }
  const day = new Date(night.date + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'long', month: 'short', day: 'numeric'});
  const haul = PLAYERS.map(n => ({n, ...night.haul[n]})).sort((a, b) => b.wins - a.wins || a.losses - b.losses)
    .map(h => `<div style="color:${color(h.n)}"><span class="who">${esc(h.n)}</span><b class="glow">+${h.wins}</b><span class="rec">${h.wins + h.losses ? `${h.wins}–${h.losses}` : 'Off night'}</span></div>`).join('');
  const side = (t, f) => `<div class="side ${f && !t.winner ? 'lost' : ''}">
      <span class="abbr glow">${esc(t.abbr)}</span>
      <span class="owner" style="color:${color(t.owner)}">${esc(t.owner === 'Unpicked' ? 'No one' : t.owner)}<span>${esc(t.record || '')}</span></span>
      <span class="pts glow">${t.score ?? ''}</span></div>`;
  const games = night.games.map(g => `<div class="game">${side(g.away, g.final)}${side(g.home, g.final)}</div>`).join('');
  el.innerHTML = `<h2 class="glow">Last night<small>${esc(day)}</small></h2>` +
    (night.games.length ? `<div class="haul">${haul}</div><div class="linescore">${games}</div>` : '<p>No games were played.</p>');
}

function rosters(st) {
  const group = (name, g, label) => `<details><summary><span class="glow" style="color:${color(name)}">${esc(label)}</span><span class="rec">${g.wins}–${g.losses}</span></summary>
    <ul class="roster">${g.teams.map(t => `<li><span>${esc(t.name)}</span><span class="wl">${t.wins}–${t.losses}</span></li>`).join('')}</ul></details>`;
  document.getElementById('rosters').innerHTML = '<h2 class="glow">Teams</h2>' +
    st.players.map(p => group(p.name, p, p.name)).join('') + group('Unpicked', st.unpicked, 'Nobody');
}
</script>
</body>
</html>
