<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Wins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #0E1B2E;
    --panel: #15253C;
    --line: #22344F;
    --text: #EEF2F7;
    --muted: #8193AD;
    --Pablo: #FF5B4F;
    --Pete: #FFB12B;
    --Micky: #3AA8FF;
    --Ryall: #4FD68A;
    --Unpicked: #6F819C;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--court);
    color: var(--text);
    font: 400 15px/1.45 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 {
    margin: 0;
    font: 800 34px/1 var(--cond);
    letter-spacing: 0.01em;
  }
  h1 span { color: var(--muted); font-weight: 600; }
  .updated { color: var(--muted); font-size: 13px; text-align: right; }

  h2 {
    margin: 36px 0 12px;
    font: 700 22px/1.1 var(--cond);
    letter-spacing: 0.01em;
  }
  h2 small { font: 500 15px var(--body); color: var(--muted); margin-left: 6px; }

  /* Race chart */
  .race { margin: 18px -4px 0; }
  .race svg { display: block; width: 100%; height: auto; overflow: visible; }
  .race .grid { stroke: var(--line); stroke-width: 1; }
  .race .tick { fill: var(--muted); font: 500 11px var(--body); }
  .race .path { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .race .dot { stroke: var(--court); stroke-width: 2; }
  .race .end-num { font: 800 26px var(--cond); }
  .race .end-name { font: 600 13px var(--cond); }
  .race .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .race .draw { animation: none; stroke-dashoffset: 0; } }

  /* Standings */
  .standings { list-style: none; margin: 8px 0 0; padding: 0; }
  .standings li {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: center;
    column-gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .standings li:last-child { border-bottom: 1px solid var(--line); }
  .standings .big { font: 800 48px/0.9 var(--cond); font-variant-numeric: tabular-nums; }
  .standings .who { font: 700 24px/1 var(--cond); }
  .standings .bar { height: 4px; border-radius: 2px; margin-top: 8px; background: currentColor; opacity: 0.9; }
  .standings .rec { text-align: right; font: 600 18px/1.1 var(--cond); }
  .standings .back { display: block; color: var(--muted); font: 400 13px var(--body); }

  /* Last night */
  .haul { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .haul div { background: var(--panel); border-top: 3px solid currentColor; padding: 8px 10px 10px; }
  .haul b { display: block; font: 800 30px/1 var(--cond); }
  .haul span { color: var(--text); font: 600 15px var(--cond); }
  .haul .rec { color: var(--muted); font: 400 12px var(--body); }

  .games { margin-top: 14px; display: grid; gap: 8px; }
  .game { background: var(--panel); padding: 4px 12px; }
  .side {
    display: grid;
    grid-template-columns: 4px 1fr auto 52px;
    align-items: center;
    column-gap: 10px;
    padding: 6px 0;
  }
  .side + .side { border-top: 1px solid var(--line); }
  .stripe { align-self: stretch; border-radius: 2px; }
  .side .team { font: 600 19px var(--cond); }
  .side .team small { font: 400 12px var(--body); color: var(--muted); margin-left: 4px; }
  .side .owner { font: 600 15px var(--cond); text-align: right; }
  .side .score { font: 800 24px var(--cond); text-align: right; font-variant-numeric: tabular-nums; }
  .side.lost .team, .side.lost .score { color: var(--muted); }
  .empty { color: var(--muted); }

  /* Rosters */
  details { border-top: 1px solid var(--line); }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    font: 700 22px var(--cond);
  }
  summary::-webkit-details-marker { display: none; }
  summary .rec { color: var(--text); font-weight: 600; }
  summary .rec::after { content: "+"; display: inline-block; width: 18px; margin-left: 10px; color: var(--muted); text-align: center; }
  details[open] summary .rec::after { content: "−"; }
  .roster { list-style: none; margin: 0 0 12px; padding: 0; }
  .roster li { display: grid; grid-template-columns: 4px 1fr auto; column-gap: 10px; align-items: center; padding: 5px 0; }
  .roster .team { font: 500 18px var(--cond); }
  .roster .wl { font: 600 18px var(--cond); font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

  @media (max-width: 380px) {
    .haul { grid-template-columns: repeat(2, 1fr); }
    .standings .big { font-size: 42px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>NBA Wins <span id="season"></span></h1>
    <div class="updated" id="updated">Loading</div>
  </header>

  <section class="race" id="race" aria-label="Cumulative wins by player over the season"></section>

  <ol class="standings" id="standings" aria-label="Standings"></ol>

  <section id="last-night"></section>

  <section id="rosters"></section>
</main>

<script>
const PLAYERS = ['Pablo', 'Pete', 'Micky', 'Ryall'];
const color = name => `var(--${PLAYERS.includes(name) ? name : 'Unpicked'})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});

// Very dark team colors (Nets, Spurs) disappear on navy, so fall back to their alternate color.
function stripeColor(t) {
  const hex = (t.color || '#888888').replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum < 40 ? (t.alt || '#888888') : t.color;
}

const get = path => fetch(`data/${path}?${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null);

Promise.all([get('standings.json'), get('history.json'), get('last_night.json')]).then(([st, hist, night]) => {
  if (!st) {
    document.getElementById('updated').textContent = 'No standings yet. Run the "Update NBA standings" workflow on GitHub.';
    return;
  }
  document.getElementById('season').textContent = st.season;
  document.getElementById('updated').textContent =
    'Updated ' + new Date(st.updated).toLocaleString(undefined, {weekday: 'short', hour: 'numeric', minute: '2-digit'});

  renderRace(hist, st);
  renderStandings(st);
  renderLastNight(night);
  renderRosters(st);
});

function renderRace(hist, st) {
  const el = document.getElementById('race');
  const days = hist ? Object.keys(hist.days) : [];
  if (days.length < 2) { el.innerHTML = '<p class="empty">The race chart appears after a couple of game days.</p>'; return; }

  // Cumulative wins per player, starting from zero the day before opening night.
  const series = PLAYERS.map(name => {
    let total = 0;
    const pts = [0, ...days.map(d => (total += hist.days[d][name] || 0))];
    return {name, pts};
  });
  const n = days.length;
  const max = Math.max(...series.map(s => s.pts[n]));
  const step = max > 60 ? 20 : max > 25 ? 10 : 5;
  const top = Math.ceil((max + 1) / step) * step;

  const W = 360, H = 230, L = 22, R = 78, T = 10, B = 24;
  const x = i => L + (i / n) * (W - L - R);
  const y = v => T + (1 - v / top) * (H - T - B);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series.map(s => `${s.name} ${s.pts[n]} wins`).join(', ')}">`;
  for (let v = 0; v <= top; v += step) {
    svg += `<line class="grid" x1="${L}" x2="${W - R + 8}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  svg += `<text class="tick" x="${x(0)}" y="${H - 4}">${fmtDay(days[0])}</text>`;
  svg += `<text class="tick" x="${x(n)}" y="${H - 4}" text-anchor="end">${fmtDay(days[n - 1])}</text>`;

  // Draw the leader last so it sits on top.
  const order = [...series].sort((a, b) => a.pts[n] - b.pts[n]);
  for (const s of order) {
    const d = s.pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    svg += `<path class="path draw" d="${d}" stroke="${color(s.name)}" style="--len:1200"/>`;
    svg += `<circle class="dot" cx="${x(n)}" cy="${y(s.pts[n])}" r="4.5" fill="${color(s.name)}"/>`;
  }

  // End labels, nudged apart so tied players don't overlap.
  const labels = order.map(s => ({s, y: y(s.pts[n])})).sort((a, b) => a.y - b.y);
  const gap = 26;
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + gap);
  const overflow = labels[labels.length - 1].y - (H - B);
  if (overflow > 0) labels.forEach(l => l.y -= overflow);
  for (let i = labels.length - 2; i >= 0; i--) labels[i].y = Math.min(labels[i].y, labels[i + 1].y - gap);
  for (const {s, y: ly} of labels) {
    svg += `<text x="${x(n) + 12}" y="${ly + 8}" fill="${color(s.name)}"><tspan class="end-num">${s.pts[n]}</tspan><tspan class="end-name" dx="4">${esc(s.name)}</tspan></text>`;
  }
  el.innerHTML = svg + '</svg>';
}

function renderStandings(st) {
  const lead = st.players[0];
  document.getElementById('standings').innerHTML = st.players.map((p, i) => {
    const gb = ((lead.wins - p.wins) + (p.losses - lead.losses)) / 2;
    const back = i === 0 ? 'Leading' : gb === 0 ? 'Tied' : `${gb} back`;
    const pct = lead.wins ? Math.max(4, (p.wins / lead.wins) * 100) : 4;
    return `<li style="color:${color(p.name)}">
      <span class="big">${p.wins}</span>
      <span><span class="who">${esc(p.name)}</span><span class="bar" style="width:${pct}%;display:block"></span></span>
      <span class="rec" style="color:var(--text)">${p.wins}–${p.losses}<span class="back">${back}</span></span>
    </li>`;
  }).join('');
}

function renderLastNight(night) {
  const el = document.getElementById('last-night');
  if (!night) return;
  const day = new Date(night.date + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'long', month: 'short', day: 'numeric'});
  if (!night.games.length) {
    el.innerHTML = `<h2>Last night<small>${esc(day)}</small></h2><p class="empty">No games were played.</p>`;
    return;
  }
  const haul = PLAYERS.map(name => ({name, ...night.haul[name]}))
    .sort((a, b) => b.wins - a.wins || a.losses - b.losses)
    .map(h => `<div style="color:${color(h.name)}">
        <span>${esc(h.name)}</span>
        <b>+${h.wins}</b>
        <span class="rec">${h.wins + h.losses ? `${h.wins}–${h.losses}` : 'Off night'}</span>
      </div>`).join('');

  const side = (t, final) => `
    <div class="side ${final && !t.winner ? 'lost' : ''}">
      <span class="stripe" style="background:${stripeColor(t)}"></span>
      <span class="team">${esc(t.short || t.name)}<small>${esc(t.record || '')}</small></span>
      <span class="owner" style="color:${color(t.owner)}">${esc(t.owner === 'Unpicked' ? 'No one' : t.owner)}</span>
      <span class="score">${t.score ?? ''}</span>
    </div>`;
  const games = night.games.map(g => `<div class="game">${side(g.away, g.final)}${side(g.home, g.final)}
    ${g.final ? '' : `<p class="note">${esc(g.status)}</p>`}</div>`).join('');

  el.innerHTML = `<h2>Last night<small>${esc(day)}</small></h2><div class="haul">${haul}</div><div class="games">${games}</div>`;
}

function renderRosters(st) {
  const group = (name, g, label) => `
    <details>
      <summary><span style="color:${color(name)}">${esc(label)}</span><span class="rec">${g.wins}–${g.losses}</span></summary>
      <ul class="roster">${g.teams.map(t => `
        <li><span class="stripe" style="background:${stripeColor(t)};height:20px"></span>
        <span class="team">${esc(t.name)}</span><span class="wl">${t.wins}–${t.losses}</span></li>`).join('')}
      </ul>
    </details>`;
  document.getElementById('rosters').innerHTML =
    '<h2>Teams</h2>' +
    st.players.map(p => group(p.name, p, p.name)).join('') +
    group('Unpicked', st.unpicked, 'Nobody picked them');
}
</script>
</body>
</html>
