<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Wins</title>
<meta name="theme-color" content="#172338">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #172338;
    --raise: #213152;
    --line: #33456A;
    --court-line: rgba(255, 255, 255, 0.10);
    --text: #F3F6FB;
    --muted: #9AA8C2;
    --ink: #14161C;
    --Pablo: #FF5B4F;
    --Pete: #FFB12B;
    --Micky: #3AA8FF;
    --Ryall: #4FD68A;
    --Unpicked: #9AA8C2;
    --face: "Bricolage Grotesque", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); font: 400 15px/1.45 var(--face);
    background: var(--bg);
    min-height: 100vh; position: relative; overflow-x: hidden; isolation: isolate;
  }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; position: relative; }
  .tab { font-variant-numeric: tabular-nums; }

  /* Faint painted lines: half-court line and center circle behind the top of the page */
  /* The floor stays put while the page scrolls over it: arena light from above, one half-court filling the screen */
  .court-clip {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(ellipse 110% 70% at 50% 0, rgba(132, 166, 255, 0.20), rgba(132, 166, 255, 0) 72%),
      radial-gradient(ellipse 150% 45% at 50% 100%, rgba(5, 10, 24, 0.5), rgba(5, 10, 24, 0) 70%);
  }
  .court { position: absolute; top: 3vh; left: 50%; height: 94vh; width: calc(94vh * 50 / 47); transform: translateX(-50%); overflow: visible; }
  .court * { fill: none; stroke: var(--court-line); stroke-width: 2.5; vector-effect: non-scaling-stroke; }

  header.wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; }
  .brand { margin: 0; display: flex; align-items: center; gap: 8px; font: 800 18px/1 var(--face); font-stretch: 75%; }
  .brand svg { width: 20px; height: 20px; flex: none; }
  .brand span { color: var(--muted); }
  .updated { color: var(--muted); font-size: 13px; }

  h1 { margin: 18px 0 6px; font: 800 34px/1.02 var(--face); font-stretch: 78%; letter-spacing: -0.01em; text-wrap: balance; }
  .dek { margin: 0; color: var(--muted); font-size: 15px; text-wrap: pretty; }

  /* Leaderboard strip */
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 18px; }
  .strip button {
    all: unset; cursor: pointer; text-align: left; min-width: 0;
    background: var(--raise); border-radius: 10px; padding: 8px 10px;
    border-bottom: 3px solid var(--c);
  }
  .strip button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .strip button[aria-current="true"] { background: var(--c); color: var(--ink); }
  .strip .n { display: block; font: 800 26px/1 var(--face); font-stretch: 75%; }
  .strip .who { font-size: 13px; font-weight: 600; }

  /* Cards */
  .deck {
    display: grid; grid-auto-flow: column; grid-auto-columns: 86%;
    gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 14px 16px 8px; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .deck::-webkit-scrollbar { display: none; }
  @media (min-width: 600px) { .deck { grid-auto-columns: 520px; padding-left: calc((100vw - 528px) / 2); padding-right: calc((100vw - 528px) / 2); } }
  .card {
    scroll-snap-align: center; background: var(--c); color: var(--ink);
    border-radius: 22px; padding: 18px 18px 14px; position: relative; overflow: hidden;
  }
  .card > * { position: relative; }
  /* Basketball seam watermark tucked into the top-right corner */
  .card .seam { position: absolute; top: -96px; right: -96px; width: 210px; height: 210px; pointer-events: none; }
  .card .seam * { fill: none; stroke: var(--ink); stroke-opacity: 0.08; stroke-width: 2.5; }
  .card .place { font-size: 14px; font-weight: 600; }
  .card h2 { margin: 2px 0 0; font: 800 54px/0.92 var(--face); font-stretch: 75%; letter-spacing: -0.01em; }
  .card .score { display: flex; align-items: flex-end; gap: 14px; margin-top: 8px; }
  .card .wins { font: 800 112px/0.8 var(--face); font-stretch: 75%; letter-spacing: -0.03em; }
  .card .side { padding-bottom: 4px; font-size: 14px; line-height: 1.35; }
  .card .side b { display: block; font: 700 22px/1 var(--face); font-stretch: 85%; margin-bottom: 2px; }
  .spark { margin: 12px 0 2px; height: 44px; }
  .spark svg { width: 100%; height: 100%; display: block; }
  .proj { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 0; padding: 8px 0; border-top: 1.5px solid rgba(20, 22, 28, 0.25); font-size: 14px; font-weight: 600; }
  .proj b { font: 800 26px/1 var(--face); font-stretch: 78%; }
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 12px; }
  .picks div { background: rgba(20, 22, 28, 0.12); border-radius: 12px; padding: 8px 10px; }
  .picks small { display: block; font-size: 12px; font-weight: 600; opacity: 0.75; }
  .picks b { display: block; font: 700 18px/1.15 var(--face); font-stretch: 85%; }
  .picks span { font-size: 13px; }
  .teams { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid rgba(20, 22, 28, 0.25); }
  .teams li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(20, 22, 28, 0.14); }
  .teams .pick { font-size: 12px; font-weight: 600; opacity: 0.6; }
  .teams .t { font-weight: 600; }
  .teams .wl { font: 700 16px var(--face); }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width 0.2s, background 0.2s; }
  .dots i.on { width: 18px; background: var(--text); }

  /* Sections below the deck */
  h3 { margin: 34px 0 12px; font: 800 24px/1 var(--face); font-stretch: 75%; }
  h3 small { font: 400 14px var(--face); color: var(--muted); margin-left: 6px; }

  .games { display: grid; gap: 8px; }
  .game { background: var(--raise); border-radius: 14px; padding: 4px 12px; }
  .row { display: grid; grid-template-columns: 1fr auto 44px; align-items: center; column-gap: 10px; padding: 6px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .t { font-weight: 600; }
  .row .t small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .row .o { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--c); color: var(--ink); }
  .row .o.none { background: var(--line); color: var(--muted); }
  .row .p { text-align: right; font: 700 18px var(--face); }
  .row.lost .t, .row.lost .p { color: var(--muted); }
  .status { color: var(--muted); font-size: 12px; margin: 4px 0 6px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .seg button { all: unset; cursor: pointer; background: var(--raise); border-radius: 10px; padding: 8px 12px; }
  .seg button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .seg button[aria-selected="true"] { background: var(--text); color: var(--ink); }
  .seg b { display: block; font: 800 18px/1.1 var(--face); font-stretch: 80%; }
  .seg small { font-size: 12px; opacity: 0.75; }
  .panes { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: 16px; align-items: start;
           overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; transition: height 0.2s; }
  .panes::-webkit-scrollbar { display: none; }
  .pane { scroll-snap-align: start; min-width: 0; }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 7px 0 1px; }
  @media (prefers-reduced-motion: reduce) { .panes { transition: none; } }

  .race { background: var(--raise); border-radius: 16px; padding: 12px 8px 6px; position: relative; overflow: hidden; }
  .race svg { display: block; width: 100%; height: auto; overflow: visible; position: relative; }
  .race .grid { stroke: var(--line); }
  .race .tick { fill: var(--muted); font: 500 11px var(--face); }
  .race .path { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .race .dot { stroke: var(--raise); stroke-width: 2; }
  .race .end { font: 800 22px var(--face); font-stretch: 78%; }
  .race .end-name { font: 600 12px var(--face); }

  .report { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .report div { background: var(--raise); border-radius: 14px; padding: 12px 14px; border-left: 4px solid var(--c); }
  .report small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .report b { display: block; font: 700 20px/1.15 var(--face); font-stretch: 82%; margin: 2px 0; }
  .report span { font-size: 14px; }

  .nobody { background: var(--raise); border-radius: 14px; padding: 14px; }
  .nobody p { margin: 0; }
  .nobody .big { font: 800 24px/1.1 var(--face); font-stretch: 78%; margin-bottom: 4px; }
  .nobody ul { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .nobody li { display: flex; justify-content: space-between; padding: 6px 0 0; }
  .nobody li span:last-child { color: var(--muted); }

  .fine { color: var(--muted); font-size: 13px; margin: 28px 0 0; }
  footer { padding-bottom: 44px; }
  .empty { color: var(--muted); }

  @media (max-width: 380px) {
    .card .wins { font-size: 96px; }
    .report { grid-template-columns: 1fr; }
    h1 { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { .dots i { transition: none; } }
</style>
</head>
<body>
<!-- A regulation half-court in feet: half-court line at y=0, baseline at y=47, basket centered at x=0 -->
<div class="court-clip" aria-hidden="true"><svg class="court" id="court" viewBox="-25 0 50 47">
  <line x1="-25" y1="0" x2="25" y2="0"/>
  <circle cx="0" cy="0" r="6"/>
  <circle cx="0" cy="0" r="2"/>
  <line x1="-25" y1="0" x2="-25" y2="47"/>
  <line x1="25" y1="0" x2="25" y2="47"/>
  <line x1="-25" y1="47" x2="25" y2="47"/>
  <path d="M-22 47V32.8A23.75 23.75 0 0 1 22 32.8V47"/>
  <rect x="-8" y="28" width="16" height="19"/>
  <circle cx="0" cy="28" r="6"/>
  <path d="M-4 41.75A4 4 0 0 1 4 41.75"/>
  <line x1="-3" y1="43" x2="3" y2="43"/>
  <circle cx="0" cy="41.75" r="0.75"/>
</svg></div>

<header class="wrap">
  <p class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#F07A2A" stroke="#14161C" stroke-width="4"/><path d="M3 32h58M32 3v58M12 12c9 11 9 29 0 40M52 12c-9 11-9 29 0 40" fill="none" stroke="#14161C" stroke-width="4" stroke-linecap="round"/></svg>
    NBA Wins <span id="season"></span>
  </p>
  <span class="updated" id="updated">Loading</span>
</header>
<div class="wrap">
  <h1 id="headline"></h1>
  <p class="dek" id="dek"></p>
  <nav class="strip" id="strip" aria-label="Standings"></nav>
</div>
<div class="deck" id="deck"></div>
<div class="dots" id="dots" aria-hidden="true"></div>
<footer class="wrap">
  <section id="games"></section>
  <section id="race-wrap"></section>
  <section id="report-wrap"></section>
  <section id="nobody-wrap"></section>
  <p class="fine" id="fine"></p>
</footer>

<script>
const PLAYERS = ['Pablo', 'Pete', 'Micky', 'Ryall'];
const GAMES = 82;
const PRIOR_GAMES = 20; // how much the preseason line counts, in games' worth of evidence
const color = n => `var(--${PLAYERS.includes(n) ? n : 'Unpicked'})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = p => fetch(`${p}?${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null);
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
const half = n => String(n).replace('.5', '½');
const signed = n => (Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : '±') + Math.abs(Math.round(n));
const gamesBack = (a, b) => ((a.wins - b.wins) + (b.losses - a.losses)) / 2;

// Projection: the team's real record so far, plus 20 games' worth of its preseason Vegas line,
// projected over the games it has left. Early on the line dominates; by midseason the record does.
let LINES = {};
let FINAL = false; // true once the regular season is over
const line = t => LINES[t.abbr] ?? GAMES / 2;
const projTeam = t => {
  const played = t.wins + t.losses;
  const pace = (t.wins + PRIOR_GAMES * line(t) / GAMES) / (played + PRIOR_GAMES);
  return t.wins + Math.max(0, GAMES - played) * pace;
};

// Snake draft: overall pick number for each team, from the order in picks.json.
function draftNumbers(picks) {
  const order = Object.keys(picks.players), out = {};
  order.forEach((name, p) => picks.players[name].forEach((abbr, r) => {
    out[abbr] = r * order.length + (r % 2 === 0 ? p + 1 : order.length - p);
  }));
  return out;
}

Promise.all([get('data/standings.json'), get('data/history.json'), get('data/last_night.json'), get('picks.json'), get('data/tonight.json')])
.then(([st, hist, night, picks, tonight]) => {
  if (!st) { document.getElementById('updated').textContent = 'No standings yet. Run the "Update NBA standings" workflow on GitHub.'; return; }
  LINES = (picks && picks.preseason_win_totals) || {};
  FINAL = !!st.final;
  document.getElementById('season').textContent = st.season;
  document.getElementById('updated').textContent = 'Updated ' + new Date(st.updated).toLocaleString(undefined,
    {weekday: 'short', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'});

  const pickNo = picks ? draftNumbers(picks) : {};
  const withMath = (t, owner) => {
    const proj = projTeam(t);
    return {...t, owner, pick: pickNo[t.abbr], line: LINES[t.abbr], proj, diff: LINES[t.abbr] != null ? proj - LINES[t.abbr] : 0};
  };
  const players = st.players.map(p => {
    const teams = p.teams.map(t => withMath(t, p.name));
    return {...p, teams, proj: Math.round(teams.reduce((s, t) => s + t.proj, 0))};
  });

  headline(players, night);
  cards(players, hist, night);
  games(night, tonight);
  race(hist);
  report(players);
  nobody(st.unpicked.teams.map(t => withMath(t, 'Unpicked')), st.unpicked);

  document.getElementById('fine').textContent =
    'Projections start from each team\'s preseason Vegas win total and shift toward its real record as games are played. ' +
    'Best and worst picks compare where each team is headed with what Vegas expected. ' +
    (picks && picks.preseason_win_totals_source ? `Lines: ${picks.preseason_win_totals_source}.` : '');
});

function headline(players, night) {
  if (FINAL) {
    const [w, r] = players;
    document.getElementById('headline').textContent = w.wins === r.wins
      ? `${w.name} and ${r.name} finish tied at ${w.wins} wins`
      : `${w.name} wins the ${document.getElementById('season').textContent} season with ${w.wins} wins`;
    document.getElementById('dek').textContent = `Final standings: ${players.map(p => `${p.name} ${p.wins}`).join(', ')}.`;
    return;
  }
  const byProj = [...players].sort((a, b) => b.proj - a.proj);
  const [a, b] = byProj;
  const margin = a.proj - b.proj;
  const h = margin <= 3 ? `${a.name} and ${b.name} are on pace for a photo finish`
                        : `${a.name} is on pace to win it by ${margin}`;
  let tonight = '';
  if (night && night.games.length) {
    const nights = PLAYERS.map(n => ({n, ...night.haul[n]})).filter(x => x.wins + x.losses > 0)
      .sort((x, y) => y.wins - x.wins || x.losses - y.losses);
    const best = nights[0], worst = nights[nights.length - 1];
    if (best && worst && best.n !== worst.n && best.wins > worst.wins)
      tonight = ` Last night, ${best.n} went ${best.wins}–${best.losses} and ${worst.n} went ${worst.wins}–${worst.losses}.`;
    else if (best) tonight = ` Last night, ${best.n} went ${best.wins}–${best.losses}.`;
  }
  document.getElementById('headline').textContent = h;
  document.getElementById('dek').textContent = `Projected finish: ${byProj.map(p => `${p.name} ${p.proj}`).join(', ')}.` + tonight;
}

function cards(players, hist, night) {
  const days = hist ? Object.keys(hist.days) : [];
  const lead = players[0];
  const maxW = Math.max(...players.map(q => q.wins), 1);

  document.getElementById('strip').innerHTML = players.map((p, i) =>
    `<button style="--c:${color(p.name)}" data-i="${i}" aria-current="${i === 0}" aria-label="${esc(p.name)}, ${p.wins} wins">
      <span class="n tab">${p.wins}</span><span class="who">${esc(p.name)}</span></button>`).join('');

  const seam = `<svg class="seam" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/>
    <path d="M4 50h92M50 4v92M18 17c12 16 12 50 0 66M82 17c-12 16-12 50 0 66"/></svg>`;

  document.getElementById('deck').innerHTML = players.map((p, i) => {
    const next = players[1];
    const place = i === 0
      ? (next && gamesBack(p, next) > 0 ? `${FINAL ? 'Champion, won' : '1st, leading'} by ${half(gamesBack(p, next))}` : '1st, tied')
      : `${ord(i + 1)}, ${gamesBack(lead, p) ? half(gamesBack(lead, p)) + ' back' : 'tied'}`;
    const ranked = [...p.teams].sort((a, b) => b.diff - a.diff);
    const best = ranked[0], worst = ranked[ranked.length - 1];
    const last = night && night.games.length ? night.haul[p.name] : null;
    let total = 0;
    const pts = [0, ...days.map(d => (total += hist.days[d][p.name] || 0))];
    const sx = k => (k / Math.max(pts.length - 1, 1)) * 300, sy = v => 40 - (v / maxW) * 36;
    const spark = pts.length > 2 ? `<div class="spark"><svg viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true">
      <path d="${pts.map((v, k) => `${k ? 'L' : 'M'}${sx(k).toFixed(1)},${sy(v).toFixed(1)}`).join('')}" fill="none" stroke="#14161C" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>` : '';
    const lastLine = last ? (last.wins + last.losses ? `Last night ${last.wins}–${last.losses}` : 'Off last night') : '';
    const teams = [...p.teams].sort((a, b) => (a.pick || 99) - (b.pick || 99)).map(t =>
      `<li><span class="pick tab">${t.pick || ''}</span><span class="t">${esc(t.name)}</span><span class="wl tab">${t.wins}–${t.losses}</span></li>`).join('');
    const pickBox = (label, t) => `<div><small>${label}</small><b>${esc(t.short || t.name)}</b>
      <span>${t.pick ? ord(t.pick) + ' pick<br>' : ''}${signed(t.diff)} vs. Vegas</span></div>`;
    return `<article class="card" id="card-${i}" style="--c:${color(p.name)}" aria-label="${esc(p.name)}">
      ${seam}
      <span class="place">${place}</span>
      <h2>${esc(p.name)}</h2>
      <div class="score"><span class="wins tab">${p.wins}</span>
        <span class="side"><b class="tab">${p.wins}–${p.losses}</b>${lastLine}</span></div>
      ${spark}
      <div class="proj"><span>${FINAL ? 'Final' : 'Projected finish'}</span><b class="tab">${FINAL ? `${p.wins}–${p.losses}` : p.proj}</b></div>
      <div class="picks">${pickBox('Best pick', best)}${pickBox('Worst pick', worst)}</div>
      <ul class="teams" aria-label="Teams in draft order">${teams}</ul>
    </article>`;
  }).join('');

  const deck = document.getElementById('deck'), dots = document.getElementById('dots');
  dots.innerHTML = players.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('');
  const buttons = [...document.querySelectorAll('.strip button')];
  const cardEls = [...deck.querySelectorAll('.card')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  buttons.forEach(b => b.addEventListener('click', () => {
    const card = cardEls[+b.dataset.i];
    deck.scrollTo({left: card.offsetLeft - (deck.clientWidth - card.clientWidth) / 2, behavior: reduce ? 'auto' : 'smooth'});
  }));
  // Highlight whichever card sits closest to the middle of the deck.
  let ticking = false;
  const sync = () => {
    ticking = false;
    const mid = deck.scrollLeft + deck.clientWidth / 2;
    let i = 0, best = Infinity;
    cardEls.forEach((c, k) => { const d = Math.abs(c.offsetLeft + c.clientWidth / 2 - mid); if (d < best) { best = d; i = k; } });
    buttons.forEach((b, k) => b.setAttribute('aria-current', k === i));
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  };
  deck.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(sync); } }, {passive: true});
  addEventListener('resize', sync);
  sync();
}

function games(night, tonight) {
  const el = document.getElementById('games');
  if (!night && !tonight) return;
  const localISO = d => d.toLocaleDateString('en-CA');
  const today = new Date(), yesterday = new Date(Date.now() - 864e5);
  const fmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'});
  const weekday = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, {weekday: 'long'});

  const row = (t, g) => `<div class="row ${g.final && !t.winner ? 'lost' : ''}">
      <span class="t">${esc(t.short || t.abbr)}<small>${esc(t.record || '')}</small></span>
      <span class="o ${PLAYERS.includes(t.owner) ? '' : 'none'}" style="--c:${color(t.owner)}">${esc(PLAYERS.includes(t.owner) ? t.owner : 'No one')}</span>
      <span class="p tab">${t.score ?? ''}</span></div>`;
  const tip = g => new Date(g.start).toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit', timeZoneName: 'short'});

  // Last night: final scores
  let lastPane = '<p class="empty">No games were played.</p>';
  if (night && night.games.length)
    lastPane = '<div class="games">' + night.games.map(g =>
      `<div class="game">${row(g.away, g)}${row(g.home, g)}${g.final ? '' : `<p class="status">${esc(g.status)}</p>`}</div>`).join('') + '</div>';

  // Tonight: the morning's schedule, with tip times
  let tonightPane = '<p class="empty">No games tonight.</p>';
  if (FINAL) tonightPane = '<p class="empty">The regular season is over.</p>';
  else if (tonight && tonight.games.length) {
    tonightPane = '<div class="games">' +
      tonight.games.map(g => `<div class="game"><div class="meta"><span>${tip(g)}</span></div>${row(g.away, g)}${row(g.home, g)}</div>`).join('') + '</div>';
  }

  const tabs = [
    {label: night && night.date === localISO(yesterday) ? 'Last night' : (night ? weekday(night.date) : 'Last night'), date: night ? fmt(night.date) : ''},
    {label: tonight && tonight.date === localISO(today) ? 'Tonight' : (tonight ? weekday(tonight.date) : 'Tonight'), date: tonight ? fmt(tonight.date) : ''},
  ];
  el.innerHTML = `<h3>Games</h3>
    <div class="seg" role="tablist" aria-label="Games">${tabs.map((t, i) =>
      `<button role="tab" id="gtab-${i}" aria-controls="gpane-${i}" aria-selected="${i === 0}"><b>${esc(t.label)}</b><small>${esc(t.date)}</small></button>`).join('')}</div>
    <div class="panes" id="panes">
      <div class="pane" id="gpane-0" role="tabpanel" aria-labelledby="gtab-0">${lastPane}</div>
      <div class="pane" id="gpane-1" role="tabpanel" aria-labelledby="gtab-1">${tonightPane}</div>
    </div>`;

  // Swipe between panes, or tap the toggle; the box resizes to whichever pane is showing.
  const panes = document.getElementById('panes'), paneEls = [...panes.children];
  const buttons = [...el.querySelectorAll('.seg button')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  buttons.forEach((b, i) => b.addEventListener('click', () =>
    panes.scrollTo({left: paneEls[i].offsetLeft - paneEls[0].offsetLeft, behavior: reduce ? 'auto' : 'smooth'})));
  let ticking = false;
  const sync = () => {
    ticking = false;
    const i = Math.round(panes.scrollLeft / Math.max(panes.clientWidth, 1));
    buttons.forEach((b, k) => b.setAttribute('aria-selected', k === i));
    panes.style.height = paneEls[i].offsetHeight + 'px';
  };
  panes.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(sync); } }, {passive: true});
  addEventListener('resize', sync);
  sync();
}

function race(hist) {
  const days = hist ? Object.keys(hist.days) : [];
  if (days.length < 2) return;
  const series = PLAYERS.map(name => { let t = 0; return {name, pts: [0, ...days.map(d => (t += hist.days[d][name] || 0))]}; });
  const n = days.length, max = Math.max(...series.map(s => s.pts[n]));
  const step = max > 120 ? 50 : max > 60 ? 20 : max > 25 ? 10 : 5, top = Math.ceil((max + 1) / step) * step;
  const W = 360, H = 210, L = 26, R = 74, T = 8, B = 22;
  const x = i => L + (i / n) * (W - L - R), y = v => T + (1 - v / top) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wins so far: ${series.map(s => `${s.name} ${s.pts[n]}`).join(', ')}">`;
  for (let v = 0; v <= top; v += step)
    svg += `<line class="grid" x1="${L}" x2="${W - R + 6}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  svg += `<text class="tick" x="${x(0)}" y="${H - 3}">${fmtDay(days[0])}</text><text class="tick" x="${x(n)}" y="${H - 3}" text-anchor="end">${fmtDay(days[n - 1])}</text>`;
  const order = [...series].sort((a, b) => a.pts[n] - b.pts[n]);
  for (const s of order) {
    svg += `<path class="path" stroke="${color(s.name)}" d="${s.pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}"/>`;
    svg += `<circle class="dot" cx="${x(n)}" cy="${y(s.pts[n])}" r="4" fill="${color(s.name)}"/>`;
  }
  const labels = order.map(s => ({s, y: y(s.pts[n])})).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 22);
  const over = labels[labels.length - 1].y - (H - B); if (over > 0) labels.forEach(l => l.y -= over);
  for (const {s, y: ly} of labels)
    svg += `<text x="${x(n) + 10}" y="${ly + 7}" fill="${color(s.name)}"><tspan class="end">${s.pts[n]}</tspan><tspan class="end-name" dx="4">${esc(s.name)}</tspan></text>`;
  document.getElementById('race-wrap').innerHTML = `<h3>The race</h3><div class="race">${svg}</svg></div>`;
}

function report(players) {
  const all = players.flatMap(p => p.teams).filter(t => t.line != null).sort((a, b) => b.diff - a.diff);
  if (all.length < 2) return;
  const box = (label, t) => `<div style="--c:${color(t.owner)}"><small>${label}</small>
    <b>${esc(t.owner)}'s ${esc(t.short || t.name)}</b>
    <span>${t.pick ? `Taken ${ord(t.pick)}. ` : ''}Vegas said ${t.line}; ${FINAL ? `finished with ${t.wins}` : `on pace for ${Math.round(t.proj)}`}.</span></div>`;
  document.getElementById('report-wrap').innerHTML =
    `<h3>Draft report</h3><div class="report">${box('Best value', all[0])}${box('Biggest bust', all[all.length - 1])}</div>`;
}

function nobody(teams, u) {
  if (!teams.length) return;
  const proj = FINAL ? u.wins : Math.round(teams.reduce((s, t) => s + t.proj, 0));
  const line = teams.reduce((s, t) => s + (t.line ?? GAMES / 2), 0);
  const names = teams.map(t => t.short || t.name).join(' and ');
  const verdict = proj - line > 3 ? 'Somebody should have taken them.' : 'No regrets so far.';
  document.getElementById('nobody-wrap').innerHTML = `<h3>The teams nobody took</h3><div class="nobody">
    <p class="big tab">${esc(names)}: ${u.wins}–${u.losses}</p>
    <p>${verdict} ${FINAL ? `Together they won ${proj} games` : `Together they're on pace for about ${proj} wins`}; Vegas expected ${line}.</p>
    <ul>${teams.map(t => `<li><span>${esc(t.name)}</span><span class="tab">${t.wins}–${t.losses}${FINAL ? '' : `, on pace for ${Math.round(t.proj)}`}</span></li>`).join('')}</ul></div>`;
}
</script>
